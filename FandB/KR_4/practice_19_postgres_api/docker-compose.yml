services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kr4_practice19
    ports:
      # 5433 на хосте — чтобы не конфликтовать с локальным PostgreSQL на 5432
      - "5433:5432"
    volumes:
      - pgdata_pr19:/var/lib/postgresql/data

volumes:
  pgdata_pr19:

